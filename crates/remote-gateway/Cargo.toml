[package]
name = "brigadier-remote"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "brigadier-remote"
path = "src/main.rs"

# The relay client: unix.rs only, as the gateway is.
[target.'cfg(unix)'.dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
webpki-roots = "=1.0.12"
