[package]
name = "brigadier-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
brigadier-frames = { path = "../frames" }
crc32fast = "=1.5.4"
deunicode = "=1.6.2"
globset = "=0.4.21"
libc.workspace = true
notify = "=8.2.2"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json.workspace = true
rusqlite = { version = "=0.41.1", features = ["bundled"] }
toml_edit = "=0.25.19"
