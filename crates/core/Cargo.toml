[package]
name = "brigadier-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
brigadier-frames = { path = "../frames" }
crc32fast = "=1.5.4"
deunicode = "=1.6.2"
libc.workspace = true
notify = "=8.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json.workspace = true
rusqlite = { version = "=0.41.1", features = ["bundled"] }
toml_edit = "=0.25.19"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
security-framework = "=3.7.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=6.0.0", features = ["crypto-rust"] }
