[package]
name = "brigadier-browser-data"
description = "Reads other browsers' profiles once for import."
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
aes = "=0.9.4"
aes-gcm = "=0.11.1"
base64 = "=0.23.1"
cbc = { version = "=0.2.1", features = ["alloc"] }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
plist = "=1.10.3"
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json.workspace = true
sha1 = "=0.11.0"
sha2 = "=0.11.1"
sysinfo = "=0.40.3"
thiserror = "=2.0.21"
tracing = "=0.1.44"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
