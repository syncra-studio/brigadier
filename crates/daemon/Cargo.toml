[package]
name = "brigadierd"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
default-run = "brigadierd"

[dependencies]
brigadier = { path = "../cli" }
brigadier-core = { path = "../core" }
brigadier-frames = { path = "../frames" }
libc.workspace = true
base64 = "=0.23.1"
getrandom = "=0.4.3"
hkdf = "=0.13.0"
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "std"] }
qrcode = { version = "=0.15.0", default-features = false, features = ["svg"] }
sha2 = "=0.11.1"
snow = { version = "=0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=6.5.0", default-features = false, features = ["default-rt"] }
zruntime = "=0.2.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Power"] }

[[bin]]
name = "brigadierd"
path = "src/main.rs"

[[bin]]
name = "brigadier-launcher"
path = "src/launcher.rs"
