[package]
name = "brigadierd"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
brigadier = { path = "../cli" }
brigadier-core = { path = "../core" }
brigadier-frames = { path = "../frames" }
libc.workspace = true
serde_json.workspace = true

[[bin]]
name = "brigadierd"
path = "src/main.rs"

[[bin]]
name = "brigadier-launcher"
path = "src/launcher.rs"
