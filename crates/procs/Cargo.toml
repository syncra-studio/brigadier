[package]
name = "brigadier-procs"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
brigadier-frames = { path = "../frames" }
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
