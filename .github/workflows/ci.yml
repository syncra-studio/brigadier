name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    # A pull request from this repository already runs on its push.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      # The daemon is Mac only, so clippy checks it for the Mac target. Linux can't compile the
      # bundled SQLite for a Mac, so this check links the system one instead; builds stay bundled.
      - run: cargo clippy --locked --target aarch64-apple-darwin -- -D warnings
        env:
          LIBSQLITE3_SYS_USE_PKG_CONFIG: 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: scripts/limits

  # The iPhone app's typecheck, beside the check: it reads app/shared from the tree [D58].
  mobile:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  # The port's compile map [D135 D171]: informational and expected red until each system's phase
  # clears it. The failing steps continue, so every step's own outcome still shows.
  port-linux:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo clippy --locked --keep-going --target x86_64-unknown-linux-gnu -- -D warnings
        continue-on-error: true

  port-windows:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-2025
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo clippy --locked --keep-going --target x86_64-pc-windows-msvc -- -D warnings
        continue-on-error: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
        continue-on-error: true

  # The drill off macOS [D135 D159]: its own process lister must pass; killloop starts and stays red
  # until each system's phase ports the product.
  port-drill:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    env:
      BIN: ${{ github.workspace }}/target/debug
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: cargo build --locked -p brigadier-procs
      - run: cargo build --locked --workspace --keep-going
        continue-on-error: true
      # A user manager, so the daemon runs as a unit and each host in a scope of its own.
      - if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for i in $(seq 50); do [ -S "/run/user/$(id -u)/systemd/private" ] && break; sleep 0.2; done
      - run: node drills/drill.mjs procs
      - run: node drills/drill.mjs killloop 5
        timeout-minutes: 10
        continue-on-error: true
      - if: runner.os == 'Linux'
        run: node drills/drill.mjs detach && BRIGADIER_SYSTEMD=0 node drills/drill.mjs detach
        continue-on-error: true
      - if: runner.os == 'Linux'
        run: node drills/drill.mjs hang && node drills/drill.mjs catalogue
        timeout-minutes: 15
        continue-on-error: true
      - if: runner.os == 'Windows'
        run: node drills/drill.mjs hang
        timeout-minutes: 10
        continue-on-error: true
      - if: runner.os == 'Windows'
        run: node drills/drill.mjs detach
        timeout-minutes: 5
        continue-on-error: true
